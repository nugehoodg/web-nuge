<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <title>Anugerah | Video Portfolio</title>
    <meta name="description" content="Video editing and motion design portfolio of Anugerah. Commercials, 3D animations, product reels, and creative cuts." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anugerah.vercel.app/videos/" />
    <meta property="og:title" content="Anugerah | Video Portfolio" />
    <meta property="og:image" content="https://anugerah.vercel.app/img/OG_banner.png" />
    <link rel="canonical" href="https://anugerah.vercel.app/videos/" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ── Design Tokens ─────────────────────────── */
        :root {
            --bg:           #ffffff;
            --bg-off:       #f8f7f5;
            --bg-card:      #f2f1ee;
            --text:         #111111;
            --text-sub:     #555555;
            --text-muted:   #999999;
            --accent:       #DB924C;
            --accent-lt:    rgba(219,146,76,0.12);
            --border:       rgba(0,0,0,0.08);
            --border-md:    rgba(0,0,0,0.14);
            --r-pill:       100px;
            --r-card:       16px;
            --ease:         cubic-bezier(0.16,1,0.3,1);
        }

        /* ── Reset ─────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: clip;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Animations ────────────────────────────── */
        @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
        @keyframes slideUp { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:translateY(0) } }
        @keyframes marquee { from { transform:translateX(0) } to { transform:translateX(-50%) } }

        /* ══════════════════════════════════════════════
           NAVBAR — minimalist frosted header
        ══════════════════════════════════════════════ */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
        }
        @media (min-width: 640px) { .nav-inner { padding: 0 40px; } }

        /* Logo / wordmark */
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }
        .nav-logo-star {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            animation: spin 3s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .nav-logo-name {
            font-size: 1.1rem;
            font-weight: 800;
            font-style: italic;
            font-family: "Courier New", monospace;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        /* Desktop links */
        .nav-links {
            display: none;
            align-items: center;
            gap: 6px;
        }
        @media (min-width: 640px) { .nav-links { display: flex; } }

        .nav-link {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-sub);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: var(--r-pill);
            border: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .nav-link:hover {
            color: var(--text);
            border-color: var(--border-md);
            background: var(--bg-off);
        }
        .nav-link.active {
            color: var(--accent);
            border-color: rgba(219,146,76,0.3);
            background: var(--accent-lt);
            font-weight: 600;
        }

        /* Mobile hamburger */
        .nav-mobile-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border-md);
            border-radius: 10px;
            background: var(--bg-off);
            cursor: pointer;
            color: var(--text);
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-mobile-btn:hover { background: var(--bg-card); border-color: var(--border-md); }
        @media (min-width: 640px) { .nav-mobile-btn { display: none; } }

        /* Mobile menu drawer */
        .nav-mobile-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 12px 24px 20px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
        }
        .nav-mobile-menu.open { display: flex; }

        .nav-mobile-link {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-sub);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            transition: color 0.2s, background 0.2s;
        }
        .nav-mobile-link:hover  { color: var(--text); background: var(--bg-off); }
        .nav-mobile-link.active { color: var(--accent); background: var(--accent-lt); font-weight: 600; }

        /* ══════════════════════════════════════════════
           BRANDS MARQUEE
        ══════════════════════════════════════════════ */
        .brands-section {
            padding: 36px 0 40px;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.7s ease 0.1s forwards;
        }

        .brands-label {
            text-align: center;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .brands-track-wrap {
            position: relative;
            overflow: hidden;
        }

        .brands-track-wrap::before,
        .brands-track-wrap::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            width: 100px;
            z-index: 2;
            pointer-events: none;
        }
        .brands-track-wrap::before { left:  0; background: linear-gradient(to right, var(--bg), transparent); }
        .brands-track-wrap::after  { right: 0; background: linear-gradient(to left,  var(--bg), transparent); }

        .brands-track {
            display: flex;
            align-items: center;
            width: max-content;
            animation: marquee 30s linear infinite;
        }
        .brands-track:hover { animation-play-state: paused; }

        .brand-logo-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 36px;
            height: 56px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
            opacity: 0.5;
            transition: opacity 0.3s ease, filter 0.3s ease;
            filter: grayscale(1);
        }
        .brand-logo-item:first-child { border-left: 1px solid var(--border); }
        .brand-logo-item:hover { opacity: 1; filter: grayscale(0); }

        .brand-logo-item img {
            height: 28px;
            width: auto;
            max-width: 110px;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* ══════════════════════════════════════════════
           VIDEO GRID
        ══════════════════════════════════════════════ */
        .grid-section { padding: 44px 0 160px; }

        .grid-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0 16px 24px;
            max-width: 1600px;
            margin: 0 auto;
        }
        @media (min-width: 640px)  { .grid-header { padding: 0 24px 26px; } }
        @media (min-width: 1024px) { .grid-header { padding: 0 32px 26px; } }
        @media (min-width: 1536px) { .grid-header { padding: 0 48px 26px; } }

        .grid-heading, .grid-count {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 16px;
            padding: 0 16px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        @media (min-width: 640px)  {
            .video-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 0 24px; }
        }
        @media (min-width: 1100px) {
            .video-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 0 32px; }
        }
        @media (min-width: 1536px) {
            .video-grid { grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 0 48px; }
        }

        /* Video Card */
        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r-card);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition:
                transform 0.45s var(--ease),
                box-shadow 0.35s ease,
                border-color 0.3s ease,
                opacity 0.45s ease;
            display: flex;
            flex-direction: column;
        }
        .video-card.visible { opacity: 1; transform: translateY(0); }
        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 50px rgba(0,0,0,0.1), 0 4px 14px rgba(0,0,0,0.05);
            border-color: rgba(0,0,0,0.16);
            z-index: 10;
        }

        /* Video media container */
        .video-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0d0d0f;
            overflow: hidden;
        }

        .video-thumb-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s var(--ease);
        }
        .video-card:hover .video-thumb-wrap video {
            transform: scale(1.04);
        }

        /* Play button overlay */
        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease;
        }
        .video-card:hover .play-overlay {
            background: rgba(0, 0, 0, 0.35);
        }

        .play-btn-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s var(--ease), background 0.2s;
        }
        .play-btn-circle svg {
            margin-left: 2px;
            fill: currentColor;
            width: 18px;
            height: 18px;
        }
        .video-card:hover .play-btn-circle {
            transform: scale(1.12);
            background: var(--accent);
            color: #ffffff;
        }

        /* Duration badge */
        .video-duration {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 4px 9px;
            border-radius: var(--r-pill);
            z-index: 2;
        }

        /* Card meta footer */
        .video-card-meta {
            padding: 16px 18px 18px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-meta-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .video-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .video-tag-pill {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            background: var(--accent-lt);
            padding: 4px 10px;
            border-radius: var(--r-pill);
            white-space: nowrap;
        }

        .video-card-client {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ══════════════════════════════════════════════
           VIDEO LIGHTBOX / MODAL
        ══════════════════════════════════════════════ */
        .video-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .video-modal-backdrop.open {
            opacity: 1;
            visibility: visible;
        }

        .video-modal-box {
            background: #ffffff;
            border: 1px solid var(--border-md);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            transform: scale(0.95) translateY(12px);
            transition: transform 0.3s var(--ease);
            display: flex;
            flex-direction: column;
        }
        .video-modal-backdrop.open .video-modal-box {
            transform: scale(1) translateY(0);
        }

        .video-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }
        .video-modal-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .video-modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
        }
        .video-modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-off);
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .video-modal-close:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .video-modal-screen {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
            max-height: 520px;
        }
        .video-modal-screen video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .video-modal-info {
            padding: 20px 24px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .video-modal-desc {
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-sub);
        }
        .video-modal-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .video-tool-badge {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-sub);
            background: var(--bg-off);
            border: 1px solid var(--border-md);
            padding: 4px 10px;
            border-radius: var(--r-pill);
        }

        /* ══════════════════════════════════════════════
           FILTER PILL — floating at bottom
        ══════════════════════════════════════════════ */
        .filter-wrap {
            position: fixed;
            bottom: 24px;
            left: 0; right: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            padding: 0 16px;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.3s forwards;
        }

        .filter-pill {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-md);
            border-radius: var(--r-pill);
            padding: 5px 7px 5px 5px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.11), 0 2px 8px rgba(0,0,0,0.05);
        }

        .filter-badge {
            background: var(--accent);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 7px 15px;
            border-radius: var(--r-pill);
            flex-shrink: 0;
            user-select: none;
        }

        /* Desktop */
        .filter-links {
            display: none;
            align-items: center;
            gap: 2px;
        }
        @media (min-width: 640px) {
            .filter-links { display: flex; }
            .filter-mob   { display: none !important; }
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 7px 15px;
            border-radius: var(--r-pill);
            font-family: inherit;
            font-size: 0.83rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            white-space: nowrap;
        }
        .filter-btn:hover  { background: var(--bg-card); color: var(--text); }
        .filter-btn.active { background: var(--accent-lt); color: var(--accent); font-weight: 700; }

        /* Mobile toggle */
        .filter-mob {
            display: flex;
            align-items: center;
        }
        .filter-mob-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 7px 13px;
            border-radius: var(--r-pill);
            font-family: inherit;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }
        .filter-mob-btn:hover { color: var(--accent); }
        .filter-mob-btn svg { transition: transform 0.3s; flex-shrink: 0; }
        .filter-mob-btn.open svg { transform: rotate(180deg); }
        .filter-mob-label { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .filter-dropdown {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.99);
            border: 1px solid var(--border-md);
            border-radius: 18px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 3px;
            z-index: 50;
            min-width: 190px;
            box-shadow: 0 -12px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(20px);
            pointer-events: auto;
        }
        .filter-dropdown.open { display: flex; }
        .filter-dropdown .filter-btn { text-align: left; padding: 10px 15px; border-radius: 10px; width: 100%; }

        /* ── Scroll-to-top ──────────────────────── */
        .scroll-top {
            position: fixed;
            bottom: 24px; right: 24px;
            width: 42px; height: 42px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border-md);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 10000;
            opacity: 0; visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s, background 0.2s, border-color 0.2s, color 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.07);
        }
        .scroll-top.show  { opacity: 1; visibility: visible; transform: translateY(0); }
        .scroll-top:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* ── Footer ─────────────────────────────── */
        .site-footer {
            border-top: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            margin-top: auto;
            font-size: 0.78rem;
        }
        @media (min-width: 640px) { .site-footer { padding: 20px 40px; } }
        .site-footer svg path { fill: var(--text-muted); transition: fill 0.25s; }
        .site-footer a:hover svg path { fill: var(--accent); }
        .footer-socials { display: flex; gap: 12px; align-items: center; }

        /* ── Scrollbar ───────────────────────────── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

        .empty-state {
            text-align: center; padding: 80px 24px;
            color: var(--text-muted); font-size: 0.95rem;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

    <!-- ══ NAVBAR ═══════════════════════════════════════════════ -->
    <header class="site-nav">
        <div class="nav-inner">
            <!-- Logo -->
            <a href="/" class="nav-logo" aria-label="Anugerah — home">
                <svg class="nav-logo-star" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                    <path fill="#DB924C" fill-rule="evenodd"
                        d="M12.75 5a.75.75 0 0 0-1.5 0v5.701l-4.937-2.85a.75.75 0 1 0-.75 1.299L10.5 12l-4.937 2.85a.75.75 0 1 0 .75 1.3l4.937-2.851V19a.75.75 0 0 0 1.5 0v-5.701l4.937 2.85a.75.75 0 0 0 .75-1.299L13.5 12l4.937-2.85a.75.75 0 0 0-.75-1.3l-4.937 2.851z"
                        clip-rule="evenodd" />
                </svg>
                <span class="nav-logo-name">Anugerah</span>
            </a>

            <!-- Desktop nav links -->
            <nav class="nav-links" aria-label="Site navigation">

    <script>
        /* ── Nav mobile toggle ── */
        const navToggle = document.getElementById('nav-toggle');
        const navMenu   = document.getElementById('nav-menu');
        navToggle.addEventListener('click', () => {
            const open = navMenu.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', open);
        });
        document.addEventListener('click', e => {
            if (!navToggle.contains(e.target) && !navMenu.contains(e.target)) {
                navMenu.classList.remove('open');
                navToggle.setAttribute('aria-expanded', 'false');
            }
        });

        /* ── Grid & Filter refs ── */
        const videoGrid   = document.getElementById('video-grid');
        const videoCount  = document.getElementById('video-count');
        const gridHeading = document.getElementById('grid-heading');
        const dropdown    = document.getElementById('filter-dropdown');
        const mobBtn      = document.getElementById('filter-mob-btn');
        const mobLabel    = document.getElementById('filter-mob-label');
        const allBtns     = () => document.querySelectorAll('.filter-btn');

        /* ── Modal refs ── */
        const modal         = document.getElementById('video-modal');
        const modalPlayer   = document.getElementById('modal-player');
        const modalTitle    = document.getElementById('modal-title');
        const modalTag      = document.getElementById('modal-tag');
        const modalDesc     = document.getElementById('modal-desc');
        const modalTools    = document.getElementById('modal-tools');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        let allVideos = [];
        let currentTag = 'all';

        /* ── Reveal & Video Play Observers ── */
        const revealObs = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    revealObs.unobserve(e.target);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px 60px 0px' });

        const videoObs = new IntersectionObserver(entries => {
            entries.forEach(e => {
                const vid = e.target.querySelector('video');
                if (!vid) return;
                if (e.isIntersecting) {
                    vid.play().catch(() => {});
                } else {
                    vid.pause();
                }
            });
        }, { threshold: 0.35 });

        /* ── Mobile filter toggle ── */
        mobBtn.addEventListener('click', e => {
            e.stopPropagation();
            const open = dropdown.classList.toggle('open');
            mobBtn.classList.toggle('open', open);
            mobBtn.setAttribute('aria-expanded', open);
        });
        document.addEventListener('click', e => {
            if (!dropdown.contains(e.target) && e.target !== mobBtn) {
                dropdown.classList.remove('open');
                mobBtn.classList.remove('open');
                mobBtn.setAttribute('aria-expanded', 'false');
            }
        });

        /* ── Open Video Modal ── */
        function openModal(item) {
            modalTitle.textContent = item.title;
            modalTag.textContent   = (item.tags && item.tags[0]) || 'Video';
            modalDesc.textContent  = item.description || 'Video edit & motion design by Anugerah.';

            modalTools.innerHTML = '';
            if (item.tools && item.tools.length) {
                item.tools.forEach(tool => {
                    const badge = document.createElement('span');
                    badge.className = 'video-tool-badge';
                    badge.textContent = tool;
                    modalTools.appendChild(badge);
                });
            }

            modalPlayer.src = `../${item.video}`;
            modalPlayer.load();
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            modalPlayer.play().catch(() => {});
        }

        function closeModal() {
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
            modalPlayer.pause();
            modalPlayer.currentTime = 0;
            modalPlayer.src = '';
            document.body.style.overflow = '';
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', e => {
            if (e.target === modal) closeModal();
        });
        window.addEventListener('keydown', e => {
            if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
        });

        /* ── Render Video Cards ── */
        function makeVideoCard(item, i) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.style.transitionDelay = `${(i % 8) * 0.06}s`;

            const primaryTag = (item.tags && item.tags[0]) || 'Video';
            const duration   = item.duration || '0:15';
            const clientName = item.client || 'Creative Showcase';

            card.innerHTML = `
                <div class="video-thumb-wrap">
                    <video muted loop playsinline preload="metadata">
                        <source src="../${item.video}">
                    </video>
                    <span class="video-duration">${duration}</span>
                    <div class="play-overlay">
                        <div class="play-btn-circle" aria-label="Play video">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                    </div>
                </div>
                <div class="video-card-meta">
                    <div class="video-meta-top">
                        <h2 class="video-card-title">${item.title}</h2>
                        <span class="video-tag-pill">${primaryTag}</span>
                    </div>
                    <p class="video-card-client">${clientName}</p>
                </div>
            `;

            // Hover preview
            const previewVideo = card.querySelector('video');
            card.addEventListener('mouseenter', () => {
                previewVideo.play().catch(() => {});
            });
            card.addEventListener('mouseleave', () => {
                previewVideo.pause();
                previewVideo.currentTime = 0;
            });

            // Click to open lightbox
            card.addEventListener('click', () => openModal(item));

            return card;
        }

        function updateMeta(tag, count) {
            const label = tag === 'all' ? 'All videos' : tag.charAt(0).toUpperCase() + tag.slice(1);
            if (gridHeading) gridHeading.textContent = label;
            if (videoCount)  videoCount.textContent  = `${count} ${count === 1 ? 'piece' : 'pieces'}`;
        }

        function render(videos) {
            videoGrid.innerHTML = '';
            if (!videos.length) {
                videoGrid.innerHTML = '<p class="empty-state">No videos found in this category.</p>';
                updateMeta(currentTag, 0);
                return;
            }
            videos.forEach((item, i) => {
                const card = makeVideoCard(item, i);
                videoGrid.appendChild(card);
                revealObs.observe(card);
                videoObs.observe(card);
            });
            updateMeta(currentTag, videos.length);
        }

        /* ── Filter ── */
        function filter(tag, labelText) {
            if (tag === currentTag) {
                dropdown.classList.remove('open');
                mobBtn.classList.remove('open');
                return;
            }
            currentTag = tag;
            allBtns().forEach(b => b.classList.toggle('active', b.dataset.tag === tag));
            if (labelText) mobLabel.textContent = labelText;

            dropdown.classList.remove('open');
            mobBtn.classList.remove('open');
            mobBtn.setAttribute('aria-expanded', 'false');

            const filtered = tag === 'all'
                ? allVideos
                : allVideos.filter(v => v.category === tag || (v.tags && v.tags.includes(tag)));

            render(filtered);
        }

        document.querySelectorAll('.filter-wrap').forEach(w => {
            w.addEventListener('click', e => {
                const b = e.target.closest('.filter-btn');
                if (b) filter(b.dataset.tag, b.textContent.trim());
            });
        });

        /* ── Scroll to top ── */
        const scrollBtn = document.getElementById('scroll-top');
        window.addEventListener('scroll', () => scrollBtn.classList.toggle('show', window.scrollY > 300));
        scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        /* ── Init ── */
        (async () => {
            try {
                const res = await fetch('../videos.json');
                allVideos = await res.json();
                render(allVideos);
            } catch (err) {
                console.error(err);
                videoGrid.innerHTML = '<p class="empty-state">Could not load videos — please try again.</p>';
            }
        })();
    </script>
